<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Amena demo 1: Live prototype</title>
<meta name="description" content="Amena Sahmoud, UX and graphic designer. Portfolio concept where the fintech case study is a working prototype.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Changa:wght@400;600;700;800&family=Inter:opsz,wght@14..32,400;14..32,600;14..32,700&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ---- shared: lightbox, badge, a11y helpers ---- */
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip{position:fixed;left:12px;top:-60px;z-index:2000;padding:10px 14px;border-radius:10px;background:#111;color:#fff;font-weight:600;text-decoration:none;transition:top .2s}
.skip:focus{top:12px}
.concept-badge{position:fixed;left:12px;bottom:12px;z-index:900;font:600 11px/1.2 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:.02em;padding:7px 11px;border-radius:999px;pointer-events:none;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.lb{position:fixed;inset:0;z-index:1500;background:rgba(6,8,18,.94);display:flex;align-items:center;justify-content:center;animation:lbIn .22s ease;touch-action:pan-y}
@keyframes lbIn{from{opacity:0}to{opacity:1}}
.lb-fig{margin:0;max-width:min(94vw,1500px);display:flex;flex-direction:column;align-items:center;gap:12px;padding:56px 12px 70px}
.lb-img{max-width:100%;max-height:calc(100vh - 150px);max-height:calc(100dvh - 150px);object-fit:contain;border-radius:8px;box-shadow:0 30px 80px rgba(0,0,0,.5);opacity:0;transform:scale(.985);transition:opacity .25s,transform .25s;background:rgba(255,255,255,.04)}
.lb-img.in{opacity:1;transform:none}
.lb-cap{color:#dfe3f3;font:14px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center;max-width:62ch}
.lb-btn{position:absolute;width:46px;height:46px;border-radius:50%;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:#fff;font-size:24px;line-height:1;cursor:pointer;display:grid;place-items:center;transition:background .15s}
.lb-btn:hover{background:rgba(255,255,255,.2)}
.lb-btn:focus-visible{outline:3px solid #8ea2ff;outline-offset:2px}
.lb-x{top:14px;right:14px;font-size:18px}
.lb-prev{left:14px;top:50%;transform:translateY(-50%)}
.lb-next{right:14px;top:50%;transform:translateY(-50%)}
.lb-count{position:absolute;top:28px;left:20px;color:#9aa3c7;font:600 12px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.08em}
@media (max-width:640px){.lb-prev,.lb-next{top:auto;bottom:14px;transform:none}.lb-prev{left:calc(50% - 56px)}.lb-next{right:calc(50% - 56px)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}}

:root{
  --blue:#1e4b9a;--blue-600:#162b55;--blue-50:#fde8f2;--blue-100:#fbd3e6;--pink:#ff218c;--yellow:#ffd800;--sky:#21b1ff;--tri:linear-gradient(90deg,var(--pink) 0 33.4%,var(--yellow) 33.4% 66.7%,var(--sky) 66.7%);
  --ink:#18181b;--ink-2:#27272a;--muted:#71717b;--line:#e4e4e7;--bg:#fafafa;--card:#fff;
  --ok:#29c941;--radius:20px;
  --shadow:0 1px 2px rgba(14,20,48,.05),0 8px 24px rgba(14,20,48,.06);
  --shadow-lg:0 2px 6px rgba(14,20,48,.06),0 30px 60px rgba(14,20,48,.12);
  --font:"Inter Display","Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--display:"Changa",ui-sans-serif,system-ui,sans-serif;--label:"Space Grotesk",ui-sans-serif,system-ui,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;font:16px/1.6 var(--font);color:var(--ink);background:var(--bg);overflow-x:hidden;-webkit-font-smoothing:antialiased}
img{max-width:100%;height:auto;display:block}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px;border-radius:6px}
#page-h:focus,#view:focus{outline:none}
main{overflow-x:clip}
.wrap{width:100%;max-width:1160px;margin:0 auto;padding:0 20px}
.muted{color:var(--muted)}
.eyebrow{font:700 12px/1 var(--label);letter-spacing:.14em;text-transform:uppercase;color:var(--blue);margin:0 0 14px}
.concept-badge{background:rgba(255,255,255,.82);color:var(--ink-2);border:1px solid var(--line);box-shadow:var(--shadow)}

/* ---------- nav ---------- */
.nav{position:sticky;top:0;z-index:100;background:rgba(247,248,251,.82);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid transparent;transition:border-color .2s}
.nav.scrolled{border-bottom-color:var(--line)}
.nav-in{display:flex;align-items:center;gap:18px;height:64px}
.brand{font-weight:800;letter-spacing:-.02em;text-decoration:none;font-size:18px;white-space:nowrap}
.brand span{color:var(--blue)}
#navlinks{display:flex;gap:4px;margin-left:auto}
#navlinks a{text-decoration:none;font-size:14px;font-weight:550;color:var(--ink-2);padding:8px 11px;border-radius:999px;transition:background .15s,color .15s}
#navlinks a:hover{background:var(--blue-50);color:var(--blue)}
#navlinks a[aria-current="page"]{background:var(--ink);color:#fff}
.menu-btn{display:none;margin-left:auto;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;font-weight:650;font-size:15px;padding:12px 20px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;transition:transform .15s,box-shadow .15s,background .15s;white-space:nowrap}
.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.btn-primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn-primary:hover{background:var(--blue-600)}
.btn-sm{padding:8px 14px;font-size:14px}
@media (max-width:900px){
  .menu-btn{display:inline-flex}
  #navlinks{position:absolute;left:12px;right:12px;top:60px;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:18px;padding:8px;box-shadow:var(--shadow-lg);display:none}
  #navlinks.open{display:flex}
  #navlinks a{padding:12px 14px;font-size:16px}
  .nav-in{gap:10px}
}

/* ---------- hero ---------- */
.hero{display:grid;grid-template-columns:1.25fr 1fr;gap:48px;align-items:center;padding-top:64px;padding-bottom:72px}
.avail{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:650;color:var(--ink-2);background:#fff;border:1px solid var(--line);padding:6px 12px 6px 10px;border-radius:999px;margin:0 0 22px}
.avail i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(41,201,65,.5);animation:ping 2s infinite}
@keyframes ping{70%{box-shadow:0 0 0 8px rgba(41,201,65,0)}100%{box-shadow:0 0 0 0 rgba(41,201,65,0)}}
.hero h1{font-size:clamp(34px,5.4vw,64px);line-height:1.04;letter-spacing:-.035em;margin:0 0 28px;font-weight:780}
.rot{color:var(--blue);display:inline-block;position:relative}
.rot span{display:inline-block;transition:opacity .35s,transform .35s}
.rot span.out{opacity:0;transform:translateY(.25em)}
.hero h1 .tail{color:var(--ink-2);font-weight:650}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.hero-art{position:relative;height:440px}
.hero-art .card{position:absolute;background:#fff;padding:8px;border-radius:22px;box-shadow:var(--shadow-lg);overflow:hidden}
.hero-art .card img{border-radius:15px;width:100%;height:100%;object-fit:cover}
.hero-art .c1{width:66%;height:58%;left:0;top:8%;transform:rotate(-4deg);animation:float 7s ease-in-out infinite}
.hero-art .c2{width:44%;height:62%;right:2%;top:0;transform:rotate(5deg);animation:float 8s ease-in-out -2s infinite}
.hero-art .c3{width:42%;height:44%;left:22%;bottom:0;transform:rotate(-1deg);animation:float 9s ease-in-out -4s infinite}
@keyframes float{50%{translate:0 -10px}}
@media (max-width:860px){.hero{grid-template-columns:1fr;padding-top:36px;gap:28px}.hero-art{height:320px;max-width:420px;width:100%;margin:0 auto}}

/* ---------- sections ---------- */
.sec{padding:72px 0}
.sec-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:28px;flex-wrap:wrap}
.sec h2,.h2{font-size:clamp(28px,3.6vw,42px);letter-spacing:-.03em;line-height:1.1;margin:0}
.feat{display:grid;gap:26px}
.feat-card{display:grid;grid-template-columns:1.25fr 1fr;background:var(--card);border-radius:28px;overflow:hidden;text-decoration:none;box-shadow:var(--shadow);border:1px solid var(--line);transition:transform .25s,box-shadow .25s}
.feat-card:nth-child(2){grid-template-columns:1fr 1.25fr}
.feat-card:nth-child(2) .feat-img{order:2}
.feat-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
.feat-img{position:relative;background:var(--blue);min-height:300px}
.feat-img img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;transition:transform .6s}
.feat-card:hover .feat-img img{transform:scale(1.03)}
.pill-live{position:absolute;left:16px;top:16px;background:#fff;color:var(--ink);font-size:12px;font-weight:700;padding:7px 12px;border-radius:999px;display:flex;gap:7px;align-items:center;box-shadow:var(--shadow)}
.pill-live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--blue);animation:ping2 1.6s infinite}
@keyframes ping2{50%{opacity:.25}}
.feat-body{padding:34px 34px 30px;display:flex;flex-direction:column;gap:10px}
.feat-body h3{font-size:clamp(24px,2.6vw,32px);letter-spacing:-.025em;line-height:1.12;margin:6px 0 0}
.feat-body p{margin:0;color:var(--muted)}
.feat-body .dates{font-size:13px;font-weight:600;color:var(--ink-2)}
.feat-body .arrow{margin-top:auto;padding-top:14px;font-weight:700;color:var(--blue)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-block;font-size:12px;font-weight:650;padding:4px 10px;border-radius:999px;background:var(--blue-50);color:var(--blue)}
@media (max-width:820px){.feat-card,.feat-card:nth-child(2){grid-template-columns:1fr}.feat-card:nth-child(2) .feat-img{order:0}.feat-img{min-height:0;aspect-ratio:4/3}.feat-body{padding:22px}}
.more{display:grid;grid-template-columns:1fr 1fr;gap:26px;margin-top:26px}
.more a{display:block;background:#fff;border:1px solid var(--line);border-radius:24px;padding:14px;text-decoration:none;box-shadow:var(--shadow);transition:transform .25s,box-shadow .25s}
.more a:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.mosaic{display:grid;grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr;gap:6px;height:220px;border-radius:14px;overflow:hidden}
.mosaic img{width:100%;height:100%;object-fit:cover}
.mosaic img:first-child{grid-row:span 2}
.more h3{margin:14px 6px 2px;font-size:20px;letter-spacing:-.02em}
.more p{margin:0 6px 4px;color:var(--muted);font-size:14px}
@media (max-width:700px){.more{grid-template-columns:1fr}}
.what{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.what-card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:28px;box-shadow:var(--shadow)}
.what-card img{width:52px;height:52px;margin-bottom:18px}
.what-card h3{margin:0 0 10px;font-size:20px;letter-spacing:-.02em}
.what-card ul{margin:0;padding:0;list-style:none}
.what-card li{padding:8px 0;border-top:1px solid var(--line);color:var(--ink-2);font-size:15px}
@media (max-width:820px){.what{grid-template-columns:1fr}}

/* about */
.about{display:grid;grid-template-columns:360px 1fr;gap:48px;align-items:start}
.portrait{border-radius:28px;overflow:hidden;box-shadow:var(--shadow-lg);position:sticky;top:90px;background:#fff}
.portrait img{width:100%;aspect-ratio:3/4;object-fit:cover}
.roles{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 30px}
.roles span{padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:14px}
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl::before{content:"";position:absolute;left:9px;top:8px;bottom:8px;width:2px;background:linear-gradient(var(--blue),var(--blue-100))}
.tl li{position:relative;padding:0 0 30px 40px}
.tl li::before{content:"";position:absolute;left:2px;top:6px;width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--blue)}
.tl h3{margin:0;font-size:18px;letter-spacing:-.01em;line-height:1.35}
.tl .when{font-size:13px;font-weight:650;color:var(--blue);margin:4px 0}
.tl p{margin:0;color:var(--muted)}
@media (max-width:860px){.about{grid-template-columns:1fr}.portrait{position:relative;top:0;max-width:340px}}
.life{display:grid;grid-template-columns:repeat(4,1fr) 1.3fr;gap:18px;align-items:center;margin-top:56px}
.polaroid{background:#fff;padding:8px 8px 10px;border-radius:6px;box-shadow:var(--shadow-lg);transition:transform .3s;border:0;cursor:zoom-in;display:block;width:100%}
.polaroid img{aspect-ratio:3/4;object-fit:cover;width:100%;border-radius:3px}
.life .polaroid:nth-child(1){transform:rotate(-4deg)}.life .polaroid:nth-child(2){transform:rotate(3deg) translateY(10px)}
.life .polaroid:nth-child(3){transform:rotate(-2deg)}.life .polaroid:nth-child(4){transform:rotate(4deg) translateY(6px)}
.life .polaroid:hover{transform:rotate(0) scale(1.04)}
.life-note{font-size:20px;line-height:1.4;font-weight:650;letter-spacing:-.01em}
.life-note .emo{font-size:24px;letter-spacing:6px;margin-top:10px}
.life-note a{color:var(--blue)}
@media (max-width:860px){.life{grid-template-columns:repeat(2,1fr)}.life-note{grid-column:1/-1}}
/* faq */
.faq{max-width:820px}
.faq details{background:#fff;border:1px solid var(--line);border-radius:18px;margin-bottom:12px;box-shadow:var(--shadow)}
.faq summary{cursor:pointer;list-style:none;padding:20px 56px 20px 22px;font-weight:650;font-size:17px;position:relative}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";position:absolute;right:20px;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;background:var(--blue-50);color:var(--blue);display:grid;place-items:center;font-size:20px;transition:transform .2s}
.faq details[open] summary::after{transform:translateY(-50%) rotate(45deg)}
.faq details p{margin:0;padding:0 22px 20px;color:var(--muted)}
.contact{background:var(--blue);color:#fff;border-radius:32px;padding:clamp(32px,6vw,72px);position:relative;overflow:hidden}
.contact::after{content:"";position:absolute;right:-80px;top:-80px;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.22),transparent 70%)}
.contact h2{font-size:clamp(30px,4.6vw,56px);line-height:1.04;letter-spacing:-.035em;margin:0 0 28px;max-width:14em}
.contact .btn{border-color:transparent}
.contact .btn-primary{background:#fff;color:var(--blue)}
.contact .btn-ghost{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.3)}
.foot{border-top:1px solid var(--line);padding:30px 0 70px;margin-top:40px}
.foot .wrap{display:flex;gap:16px;justify-content:space-between;flex-wrap:wrap;align-items:center}
.foot nav{display:flex;gap:16px;flex-wrap:wrap}
.foot a{color:var(--muted);text-decoration:none;font-size:14px}
.foot a:hover{color:var(--blue)}

/* ---------- case study ---------- */
.case-hero{padding-top:44px;padding-bottom:28px}
.back{display:inline-flex;gap:6px;text-decoration:none;font-weight:600;color:var(--muted);font-size:14px;margin-bottom:28px}
.back:hover{color:var(--blue)}
.case-hero h1{font-size:clamp(36px,6vw,72px);line-height:1.02;letter-spacing:-.04em;margin:0 0 14px;font-weight:800}
.lede{font-size:clamp(18px,2vw,22px);color:var(--ink-2);margin:0 0 30px}
.cs-meta{display:grid;grid-template-columns:repeat(4,auto);justify-content:start;gap:16px 44px;margin:0 0 24px;padding:22px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.cs-meta dt{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:6px}
.cs-meta dd{margin:0;font-weight:600}
@media (max-width:720px){.cs-meta{grid-template-columns:1fr 1fr}}
.link-ext{font-weight:650;color:var(--blue);text-decoration:none;font-size:15px}
.link-ext:hover{text-decoration:underline}
.cover{display:block;width:100%;border:0;padding:0;background:var(--blue);border-radius:28px;overflow:hidden;cursor:zoom-in;box-shadow:var(--shadow-lg)}
.cover img{width:100%}
/* prototype */
.proto{padding:90px 0 40px}
.proto-head{max-width:720px;margin-bottom:34px}
.proto-head h2{font-size:clamp(28px,3.8vw,44px);line-height:1.08;letter-spacing:-.03em;margin:0 0 12px}
.proto-grid{display:grid;grid-template-columns:1fr 360px;gap:56px;align-items:start}
.chapters{list-style:none;margin:0;padding:0}
.chap{min-height:64vh;padding:26px 0;display:flex;flex-direction:column;justify-content:center}
.chap:last-child{min-height:56vh}
.chap-btn{display:flex;align-items:center;gap:14px;border:0;background:none;padding:0;cursor:pointer;text-align:left}
.chap-n{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:14px;background:#fff;border:1px solid var(--line);color:var(--muted);transition:all .25s}
.chap-t{font-size:clamp(22px,2.4vw,30px);font-weight:750;letter-spacing:-.025em;line-height:1.15;color:#a3a9bd;transition:color .25s}
.chap-body{padding-left:54px;opacity:.45;transition:opacity .3s}
.chap-q{margin:16px 0 0;font-size:17px;color:var(--ink-2);border-left:3px solid var(--blue-100);padding-left:14px}
.chap-q cite{display:block;font-style:normal;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.chap-try{margin:16px 0 0;font-size:14px;font-weight:650;color:var(--blue);display:flex;gap:8px;align-items:center}
.chap-try::before{content:"";width:18px;height:18px;border-radius:50%;border:2px solid currentColor;background:radial-gradient(circle,currentColor 0 3px,transparent 4px)}
.chap.on .chap-n{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 8px 18px rgba(30,75,154,.3)}
.chap.on .chap-t{color:var(--ink)}
.chap.on .chap-body{opacity:1}
.chap.on .chap-q{border-left-color:var(--blue)}
.phone-col{position:sticky;top:84px}
.ph-nav{display:none}
@media (max-width:980px){
  .proto-grid{grid-template-columns:1fr;gap:20px}
  .phone-col{position:relative;top:0;order:-1}
  .chapters{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px;padding:4px 20px 12px;margin:0 -20px;scrollbar-width:none;overscroll-behavior-x:contain}
  .chapters::-webkit-scrollbar{display:none}
  .chap,.chap:last-child{min-height:0;flex:0 0 86%;scroll-snap-align:center;background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;justify-content:flex-start;box-shadow:var(--shadow)}
  .chap-body{padding-left:0;opacity:1}
  .chap-t{font-size:19px;color:var(--ink)}
  .chap-n{width:32px;height:32px;font-size:13px}
  .chap-q{font-size:15px}
  .ph-nav{display:flex;justify-content:center;align-items:center;gap:14px;margin-top:14px}
}
.ph-nav button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:18px}
.ph-dots{display:flex;gap:6px}
.ph-dots i{width:7px;height:7px;border-radius:50%;background:var(--blue-100);transition:all .25s}
.ph-dots i.on{background:var(--blue);width:20px;border-radius:4px}
/* the phone */
.phone{width:min(330px,86vw);height:660px;margin:0 auto;border-radius:52px;padding:11px;background:linear-gradient(145deg,#2a2f45,#0c0f1d);box-shadow:0 0 0 2px #3a405a inset,0 40px 80px rgba(14,20,48,.28),0 10px 24px rgba(14,20,48,.2)}
@media (max-width:420px){.phone{height:600px}}
.ph-screen{position:relative;width:100%;height:100%;border-radius:42px;background:#fff;overflow:hidden;display:flex;flex-direction:column;font-size:14px;color:#111733}
.ph-status{height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 26px 0 30px;font-weight:700;font-size:14px}
.ph-island{width:96px;height:28px;border-radius:20px;background:#0c0f1d}

t from Fortune 500 sponsors"},{"t":"h2","x":"FAQs"},{"t":"p","x":"What kind of roles are you looking for?"},{"t":"p","x":"I'm focused on UX and product design roles. Ideally where I can own end-to-end flows, from research through to polished interaction design."},{"t":"p","x":"Are you open to full-time, part-time, or contract roles?"},{"t":"p","x":"Are you open to relocating for a full-time role?"},{"t":"h2","x":"Let's Talk About What You're Building"},{"t":"p","x":"Name*"},{"t":"p","x":"Email*"},{"t":"p","x":"Message"},{"t":"p","x":"Submit"},{"t":"p","x":"Submit"}],"/project/sahl-system-design":[{"t":"h1","x":"One System, 200+ Services"},{"t":"p","x":"Scalable navigation for a fintech app"},{"t":"p","x":"View App"},{"t":"p","x":"Role"},{"t":"p","x":"Primary designer"},{"t":"p","x":"Duration"},{"t":"p","x":"2024–2025"},{"t":"p","x":"Company"},{"t":"p","x":"Sahl"},{"t":"p","x":"Skills"},{"t":"p","x":"UX strategy"},{"t":"p","x":"design system"},{"t":"p","x":"fintech"},{"t":"img","src":"https://framerusercontent.com/images/p48II89wSQn6PgMutcDwmectuY.png","alt":""},{"t":"h2","x":"Overview"},{"t":"p","x":"Sahl helps people manage all their household payments in one place. The goal was to turn a fragmented payment landscape into one seamless experience that saves time and reduces anxiety."},{"t":"p","x":"The problem: Inconsistent service flows and overwhelming navigation caused high drop-off and confusion. The existing system couldn’t scale with Sahl’s growing list of services."},{"t":"p","x":"My role: I designed a consistent navigation pattern and a set of reusable components the team could scale with, working with one other designer, and a PM."},{"t":"h4","x":"About Sahl"},{"t":"p","x":"5M+ active users ·"},{"t":"p","x":"200+ services ·"},{"t":"p","x":"#1 fintech app in Egypt"},{"t":"h3","x":"Process"},{"t":"p","x":"DISCOVER"},{"t":"p","x":"Usability observations and alignment sessions with Customer Success"},{"t":"p","x":"DEFINE"},{"t":"p","x":"Strategy board and core obstacles"},{"t":"p","x":"IDEATE"},{"t":"p","x":"Unified UX patterns and scalable systems"},{"t":"p","x":"DESIGN"},{"t":"p","x":"Standardized UI components and a bilingual experience"},{"t":"p","x":"TEST"},{"t":"p","x":"Validated with Customer Success alignment and available funnel data"},{"t":"h2","x":"Strategy Board"},{"t":"p","x":"These were the targets we set going in — not results we claim."},{"t":"h5","x":"Problem"},{"t":"p","x":"Fragmented dropdowns and inconsistent first screens across 200+ service flows created confusion and high drop-off."},{"t":"h5","x":"Objective"},{"t":"p","x":"Standardize the user journey and unify navigation logic for all household payments, while supporting rapid service expansion."},{"t":"h5","x":"Customer Segment"},{"t":"p","x":"Existing Sahl users and new digital adopters in Egypt looking for simpler payment experiences."},{"t":"h5","x":"Success Measure"},{"t":"p","x":"Less first-screen drop-off and faster time-to-action for top services."},{"t":"h5","x":"Goals"},{"t":"p","x":"Fewer user errors, fewer Customer Success tickets, faster implementation cycles, more user confidence."},{"t":"h2","x":"Research"},{"t":"p","x":"I worked from three sources: ongoing collaboration with Customer Success (recurring complaints, edge cases, friction moments), competitor analysis, and usability observations."},{"t":"p","x":"Key finding — navigation and provider identification: Services used inconsistent first-screen logic and long text-only dropdowns. Without visual cues like logos, users struggled to identify providers, leading to wrong selections and early exits."},{"t":"p","x":"The resulting pattern: logo-first selection, alphabetical ordering, searchable lists — one navigation pattern across 200+ services, fewer selection errors."},{"t":"h2","x":"Sitemap"},{"t":"p","x":"The map covered every entry point into the app: sign in/sign up, and every service category beneath it — mobile, internet, landline, gaming, education, donations, and general bills. For each, I traced the full payment path down to the final screen, and kept a separate log of error states and edge cases alongside a running notes sheet of insights worth solving systemically rather than fixing one flow at a time."},{"t":"img","src":"https://framerusercontent.com/images/zsMjFByJiGWecBYVq669ytv9j4.png","alt":""},{"t":"p","x":"Sitemap of the entire app before any changes."},{"t":"h2","x":"Wireframes & Early Concepts"},{"t":"p","x":"I sketched three core patterns before touching high fidelity:"},{"t":"p","x":"Bundle purchase: mobile → operator → service → choose bundle"},{"t":"p","x":"Top-up: mobile → operator → top-up type → amount → pay"},{"t":"p","x":"Bill enquiry: mobile → operator → bills → bill info → select bill(s) → pay"},{"t":"p","x":"I also explored a separate donations flow (search/recents/full list → selected cause → pay) and tested an alternate NFC-based top-up path for smart meters, flagging open questions directly on the sketches — like whether to auto-select a service when there was only one option, or drop unnecessary fields depending on the entry point."},{"t":"img","src":"https://framerusercontent.com/images/c2tvsBA3i7aIzd8HgNCGlglFOA.png","alt":""},{"t":"p","x":"Some wireframes sketching out all services and their shared solutions."},{"t":"h2","x":"Scaling the pattern: Donations, Education & Gaming"},{"t":"p","x":"Donations, Education, and Gaming vouchers all suffered from the same core problem as telecom — long text-only dropdowns, no visual cues, and anxiety at the payment step. So all three got the same treatment, built from the same components:"},{"t":"img","src":"https://framerusercontent.com/images/GOr7v7tvOFz71NAfftdIZtIodQ.png","alt":""},{"t":"img","src":"https://framerusercontent.com/images/FRCYbHM9DnK3V82x1RLrLNcStTw.png","alt":""},{"t":"img","src":"https://framerusercontent.com/images/YAcog5GsUPFTpJzVomrkoD3Ro.png","alt":""},{"t":"p","x":"Giving meant a phone-number field and one long text dropdown of charities — no logos, no search, no discovery."},{"t":"p","x":"Three ways in. Recents — \"Donate Again\" repeats a frequent contribution in a single tap, removing friction from habit-based giving. Spotlight — prominent placement for urgent and seasonal causes, like Ramadan Iftar campaigns, that adapts to what the moment needs. All — every charity, logo-first, searchable, alphabetical."},{"t":"img","src":"https://framerusercontent.com/images/bCbZMWscntYVzSEENecXZjoO9U.png","alt":""},{"t":"p","x":"After: Recents with one-tap \"Donate Again,\"Spotlight for urgent and seasonal causes like Ramadan Iftar, and a searchable logo-first list of all charities."},{"t":"h2","x":"Education Services: New"},{"t":"img","src":"https://framerusercontent.com/images/McJUvLGfOhuQx7zPTF1Yja8.png","alt":""},{"t":"p","x":"Education: searchable institution list, student-ID guidance in-flow, details confirmed before payment."},{"t":"h2","x":"Gaming Vouchers: New"},{"t":"img","src":"https://framerusercontent.com/images/XFoAc1rMUUi7EQyxMwyWe6mLyJc.png","alt":""},{"t":"p","x":"Gaming: legible voucher codes, mandatory store selection, redemption guide built into the flow."},{"t":"p","x":"After: Recents with one-tap \"Donate Again,\" Spotlight for urgent and seasonal causes like Ramadan Iftar, and a searchable logo-first list of all charities."},{"t":"h2","x":"Telecom Services"},{"t":"h3","x":"The Problem"},{"t":"p","x":"Telecom covers mobile, landline, and internet. Each has up to 5 providers (Vodafone, Orange, e& (Etisalat), WE, Nour), and each provider offers different payment types. Every service started on a different first screen."},{"t":"p","x":"Every step needed its own screen, with noticeable loading in between"},{"t":"p","x":"Internet used a different structure than mobile"},{"t":"p","x":"Landline asked users to pick an operator when only one existed"},{"t":"h3","x":"The Solution"},{"t":"p","x":"Logo-first selection: Searchable, alphabetical, logo-based provider lists."},{"t":"p","x":"Dynamic content: Payment types appear based on the selected provider."},{"t":"p","x":"Consistent UX: The same interaction pattern across all telecom services."},{"t":"h3","x":"The Impact"},{"t":"p","x":"Fewer re-entries during provider selection"},{"t":"p","x":"Fewer steps to complete a payment"},{"t":"p","x":"Less confusion through instant provider recognition"},{"t":"p","x":"Faster provider lookup through search"},{"t":"h2","x":"Telecom Services: Old"},{"t":"img","src":"https://framerusercontent.com/images/OSX5HoYLQ6cZmPGcj2LwbV2jU.png","alt":""},{"t":"img","src":"https://framerusercontent.com/images/v7HD1CETk56VbdGTbPeiKaLcttA.png","alt":""},{"t":"img","src":"https://framerusercontent.com/images/TDo7YiBgJVUUDTXuTzr3xBBuEg.png","alt":""},{"t":"h2","x":"Telecom Services: New"},{"t":"img","src":"https://framerusercontent.com/images/geYyEXoPJMxZ8kyMwlyZtUve0.png","alt":""},{"t":"p","x":"New mobile navigation flow, also applies to the rest of the Telecom services (Landline and Internet)"},{"t":"h2","x":"Design System & Scalability"},{"t":"p","x":"I moved the team from ad-hoc UI to a structured design language, so new services could launch using standard components."},{"t":"p","x":"Long-list navigation: Alphabetical, searchable, logo-first lists for large provider directories."},{"t":"p","x":"Recall Card: A verification component used across most services to prevent errors at the final step."},{"t":"p","x":"Info cards: In-flow guidance that helps users find IDs and meter numbers."},{"t":"p","x":"Data collection rules: Unified input validation and formatting across all service types."},{"t":"p","x":"The Recall Card It reduces refund and reversal requests by catching errors before payment is confirmed, and it's used across telecom, utilities, education, and donations."},{"t":"p","x":"01"},{"t":"p","x":"Real-Time Validation"},{"t":"p","x":"Distinguishes ambiguous characters (1/l, 0/O) in vouchers and requires regional store selection to prevent redemption errors."},{"t":"p","x":"02"},{"t":"p","x":"Identity Confirmation"},{"t":"p","x":"Info cards guide users to their student ID, and searchable lists replace complex dropdowns for 15+ institutions."},{"t":"p","x":"03"},{"t":"p","x":"Friction as a Feature"},{"t":"p","x":"An intentional pause for verification that prevents costly reversals and builds user confidence."},{"t":"img","src":"https://framerusercontent.com/images/YXuDNcEWYjpLnKwLKZezk9GI3nc.png","alt":""},{"t":"img","src":"https://framerusercontent.com/images/RRen8tY0tVGnB80jy8gaOmOFOw.png","alt":""},{"t":"img","src":"https://framerusercontent.com/images/q2YqHA5rgEmco9JuQ4NdqeCmQ.png","alt":""},{"t":"p","x":"Recall Card: present in every flow"},{"t":"h2","x":"Outcome"},{"t":"p","x":"Scalability: Rigid, hard-coded flows became dynamic, searchable structures ready for rapid growth."},{"t":"p","x":"Trust: Anxiety-inducing inputs became verified transactions with fewer errors, through the Recall Card."},{"t":"p","x":"Efficiency: Clear self-serve navigation helped reduce the load on support."},{"t":"p","x":"By the numbers: 1 navigation pattern and 4 standardized user flows across 200+ services, 80+ providers, 15+ institutions."},{"t":"p","x":"A note on measurement: As an early-stage startup, we had limited analytics in place, so impact reflects Customer Success feedback and the funnel signals we could gather."},{"t":"h2","x":"Go deeper"},{"t":"p","x":"Information architecture — Structuring 200+ services for intuitive discovery."},{"t":"p","x":"Wireframes and early concepts — Hand-sketched flows to test consistent patterns."},{"t":"p","x":"Donations — Spotlight campaigns and one-tap repeat giving."},{"t":"p","x":"Education — Clearer guidance, fewer wrong entries."},{"t":"p","x":"Gaming vouchers — Preventing redemption errors."},{"t":"p","x":"Internet and landline — Same problem, same pattern."}],"/project/mascot":[{"t":"h1","x":"A Face for Fintech"},{"t":"p","x":"From research to character: building a mascot people could trust"},{"t":"p","x":"Role"},{"t":"p","x":"Character strategy and original concept"},{"t":"p","x":"Duration"},{"t":"p","x":"Aug 2023 – May 2024 · Launched Jul 2025"},{"t":"p","x":"Company"},{"t":"p","x":"Sahl"},{"t":"p","x":"Skills"},{"t":"p","x":"Character Design"},{"t":"p","x":"Brand"},{"t":"img","src":"https://framerusercontent.com/images/tNwtMJIjqr0NKp06CxiIuL31Rec.png","alt":""},{"t":"h2","x":"Overview"},{"t":"p","x":"Sahl makes household payments easy — but easy only matters if people trust you. In Egypt’s fintech market, the hardest users to win are the ones who need the product most: lower-income, less tech-literate customers who are understandably wary of trusting a new app with their money."},{"t":"h2","x":"The Problem"},{"t":"p","x":"Sahl needed a recognizable, friendly face — something to humanize a technical service and build familiarity across marketing and, eventually, the product itself."},{"t":"h2","x":"My Role"},{"t":"p","x":"I initiated the mascot research, built the character strategy, and designed the original concept — chosen from three designers’ visions — then developed it through v3 before handing visual refinement to our team’s illustrator."},{"t":"h2","x":"Process"},{"t":"p","x":"Research → Strategy → Character → Visual design → Rollout plan"},{"t":"h2","x":"Why a Mascot"},{"t":"p","x":"I started with research: how mascots work in B2C versus B2B, and close studies of two companies doing it well. Salesforce built an entire mascot family, each character fronting a product or community. Hootsuite’s Owly became the relatable voice of the social media managers who actually use the tool."},{"t":"p","x":"That raised our key strategic question: one mascot or many? Sahl serves both consumers and businesses, but we were still a young brand — multiple characters would confuse before they could connect. We chose one mascot who could wear different hats per context: the same face on a koshk poster, a LinkedIn post, and in your app."},{"t":"p","x":"The proposal went through our design lead, then the marketing manager, then a C-level presentation. All three approved."},{"t":"h2","x":"Building The Character"},{"t":"p","x":"Before any drawing, we defined who this character is. Each designer on the team drafted the traits that made sense to them; we merged them into one foundation. Fast, empathetic, innovative. Three values: time, people, innovation. A signature object: a lightning-bolt button on his robotic arm, tying him to Sahl’s logo. Even his fears mapped to product promises — crowds and downtime, the exact things Sahl exists to eliminate."},{"t":"p","x":"His working name was Ra3d — thunder, to Sahl’s lightning."},{"t":"h2","x":"From Sketch to Budz"},{"t":"p","x":"Each of the three designers on the team sketched their own vision for the character. Mine was chosen as the direction, and I developed it from the first sketch through v3."},{"t":"p","x":"We had set clear visual principles early: simple shapes, two to three colors, a silhouette you’d recognize anywhere. My drafts established the direction but weren’t fully landing those principles. Fatma ElQady , the strongest illustrator on our team, took over from v4 and drove them home — the final Budz is rounder, simpler, and friendlier, and it’s what finally cleared the marketing approval round and then C-level, with further refinements deliberately parked for a future rebrand cycle, the way any company iterates on its brand."},{"t":"p","x":"Defining what success looked like, then recognizing whose craft would get us there, was the job."},{"t":"img","src":"https://framerusercontent.com/images/eHlOx5BdQRLXzEF2XJsJa2EKzKs.png","alt":""},{"t":"p","x":"Evolution: Sketch → v1 → v2 → v3"},{"t":"img","src":"https://framerusercontent.com/images/3nVqWFWvOT9gMX0YgJU2ZLx2jlQ.jpeg","alt":""},{"t":"p","x":"Final Budz illustration"},{"t":"h2","x":"Launch & Rollout"},{"t":"p","x":"Development wrapped in mid-2024, but the public launch waited until July 2025 — revenue-critical campaigns took priority for a small startup marketing team, and the mascot could wait. Startup prioritization in practice."},{"t":"p","x":"The launch was an animated origin story produced with an agency and published across Sahl’s socials. Since then, Budz fronts Instagram , Facebook , TikTok , and LinkedIn in both stills and reels, joined the company’s new event booth, and made his first in-app appearance on the loading screen."},{"t":"p","x":"I moved from the marketing team to the product team in June 2024; the team carried the rollout forward roughly on the plan I’d set — model sheet, expressions library, print and swag, storyboard, launch video, and in-app presence."},{"t":"img","src":"https://framerusercontent.com/images/I59WTho6bVBtwXMYKLNMMRqmrQ8.png","alt":""},{"t":"p","x":"Final Budz illustration"},{"t":"img","src":"https://framerusercontent.com/images/FdV8k1wphlhalOJc4HrXPPJ5VDU.png","alt":""},{"t":"p","x":"Sitemap of the entire app before any changes."},{"t":"img","src":"https://framerusercontent.com/images/7iJQHwhToBTq41BN4vTBXb48ex8.jpg","alt":""},{"t":"img","src":"https://framerusercontent.com/images/17sUAe5bqznJ5psqgQIiGjvZVrk.jpg","alt":""},{"t":"p","x":"Budz in the wild: Sahl social content. Produced by the Sahl marketing team."},{"t":"h2","x":"By The Numbers"},{"t":"p","x":"(public platform counts, September 2026)"},{"t":"p","x":"Launch film: ~600K views across platforms — 286.8K on TikTok, 230K on Instagram, 82K on Facebook"},{"t":"p","x":"On TikTok and Instagram, that’s roughly 7× the follower count of each account — the film reached well beyond Sahl’s existing audience"},{"t":"p","x":"The launch film remains Budz’s best-performing content to date"},{"t":"p","x":"An honest read: Since launch, Budz appears at seasonal moments — Eid, new year — and on Sahl’s event booth, while day-to-day content leans on real people. That’s a lighter presence than the always-on character in my original plan, and it’s the real lesson of the project: a mascot isn’t an asset, it’s a content system. What I’d push for next is the expressions library and ready-to-use templates that make Budz cheap to deploy — so he becomes part of Sahl’s daily voice rather than an occasional guest."},{"t":"p","x":"The goal I set for him still stands: a lighthearted guide who bridges the gap between new-to-fintech users and a product asking for their trust."},{"t":"p","x":"(public platform counts, September 2026)"},{"t":"p","x":"Final character illustration by Fatma ElQady . Launch animation by agency partner. Rollout and social content by the Sahl marketing team."}],"/project/photography":[{"t":"h1","x":"Photography"},{"t":"img","src":"https://framerusercontent.com/images/8WC218oBVeLyid6UlBg4wwhz61M.jpg","alt":"Beit Teita"},{"t":"img","src":"https://framerusercontent.com/images/vg7MIA51vbN3oQ3LxGrF51k9c0.jpg","alt":"Beit Teita"},{"t":"img","src":"https://framerusercontent.com/images/xgPfSYbxlfk9rdHZcRqP5eooY.jpg","alt":"Beit Teita"},{"t":"img","src":"https://framerusercontent.com/images/NNgtL9FFfdH0kHkzzxiqUSPzas.jpg","alt":"Untitled"},{"t":"img","src":"https://framerusercontent.com/images/8hIjhDrtJrWFjz15eGkSYrF8pI.jpg","alt":"Beit Teita"},{"t":"img","src":"https://framerusercontent.com/images/Ikp9ZAPHjAjABTNluIyVazX5LJ0.jpg","alt":"Untitled"},{"t":"img","src":"https://framerusercontent.com/images/vtoGsbaJ1GH2gFQ9qi0ngBsc0.jpg","alt":"Untitled"},{"t":"img","src":"https://framerusercontent.com/images/DvzW6g71sWExdlTjvkWrtGios.jpg","alt":"Untitled"},{"t":"img","src":"https://framerusercontent.com/images/2SGu5ZN9eYWEgRg1XkdHgpH5RNY.jpg","alt":"Untitled"},{"t":"img","src":"https://framerusercontent.com/images/W48Xjbl3UdDaNtdWqebGwgzUA.jpg","alt":"Untitled"},{"t":"img","src":"https://framerusercontent.com/images/QpdjkpYGOK2F05Tu7IRScedd1M.jpg","alt":"Untitled"},{"t":"img","src":"https://framerusercontent.com/images/IX5SDJOiCxfaFfafqxmUXISh9I.jpg","alt":"Untitled"},{"t":"img","src":"https://framerusercontent.com/images/UJxr6v0S4N1iEaLCBXLDJla450.jpg","alt":"Untitled"},{"t":"img","sr
