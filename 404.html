<style>
:root{
  --blue:#1e4b9a;--pink:#ff218c;--yellow:#ffd800;--sky:#21b1ff;
  --tri:linear-gradient(90deg,var(--pink) 0 33.4%,var(--yellow) 33.4% 66.7%,var(--sky) 66.7%);
  --ink:#18181b;--muted:#71717b;--line:#e4e4e7;--bg:#fafafa;
  --font:"Inter Display","Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --display:"Changa",ui-sans-serif,system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font)}
.top{position:relative;padding:22px 0}
.top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--tri)}
.wrap{width:min(1120px,100% - 32px);margin:0 auto}
.brand{font-family:var(--display);font-weight:800;font-size:18px;color:var(--ink);text-decoration:none}
main{padding:clamp(32px,7vw,88px) 0}
.nf{display:grid;grid-template-columns:1.15fr 1fr;gap:clamp(28px,5vw,64px);align-items:center}
.nf img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:16px;display:block}
.code{font-family:var(--display);font-weight:800;font-size:clamp(72px,11vw,140px);line-height:.9;margin:0;color:var(--blue);letter-spacing:-.02em}
.msg{font-size:clamp(18px,2vw,21px);line-height:1.5;color:var(--ink);margin:18px 0 26px;max-width:26em}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.btns a{font-weight:600;font-size:15px;text-decoration:none;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:999px;padding:10px 18px;transition:border-color .15s,color .15s,transform .15s}
.btns a:hover{border-color:var(--sky);color:var(--blue);transform:translateY(-2px)}
.btns a.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btns a.primary:hover{color:#fff;background:#162b55}
@media (max-width:760px){.nf{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="top"><div class="wrap"><a class="brand" href="/">Amena Sahmoud</a></div></header>
<main class="wrap">
  <div class="nf">
    <img src="/img/404-bench.webp" alt="An empty park bench between two trees">
    <div>
      <h1 class="code">404</h1>
      <p class="msg">couldn't find what you're looking for. take a seat and have a look at one of these pages instead.</p>
      <nav class="btns" aria-label="Pages">
        <a class="primary" href="/">Home</a>
        <a href="/#/work/sahl-system-design">Sahl System</a>
        <a href="/#/work/mascot">Budz Mascot</a>
        <a href="/#/photography">Photography</a>
        <a href="/#/graphic-design">Graphic Design</a>
        <a href="/#/about">About</a>
      </nav>
    </div>
  </div>
</main>
</body>
</html>
